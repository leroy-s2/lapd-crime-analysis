<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Consulta delictiva · LAPD</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fafb">
  <script>
    // Apply the saved choice before styles paint, avoiding a white flash in dark mode.
    (function () {
      var theme = 'light';
      try { if (localStorage.getItem('lapd-theme') === 'dark') theme = 'dark'; } catch (_) {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b1220' : '#f9fafb');
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=lapd-map-1">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=lapd-map-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

</html>
